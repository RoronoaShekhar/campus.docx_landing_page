<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arjuna JEE 2027 — Study Planner</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #ffffff;
    --bg2: #f5f5f4;
    --bg3: #eeede9;
    --text: #1a1a1a;
    --text2: #6b7280;
    --text3: #9ca3af;
    --border: rgba(0,0,0,0.1);
    --border2: rgba(0,0,0,0.18);
    --radius-md: 8px;
    --radius-lg: 12px;
    --phy: #378ADD;
    --phy-bg: #E6F1FB;
    --phy-text: #0C447C;
    --phy-sub: #185FA5;
    --math: #7F77DD;
    --math-bg: #EEEDFE;
    --math-text: #3C3489;
    --math-sub: #534AB7;
    --chem: #1D9E75;
    --chem-bg: #E1F5EE;
    --chem-text: #085041;
    --chem-sub: #0F6E56;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1c1c1e;
      --bg2: #2c2c2e;
      --bg3: #3a3a3c;
      --text: #f2f2f7;
      --text2: #aeaeb2;
      --text3: #636366;
      --border: rgba(255,255,255,0.1);
      --border2: rgba(255,255,255,0.18);
      --phy-bg: #0C447C;
      --phy-text: #B5D4F4;
      --phy-sub: #85B7EB;
      --math-bg: #3C3489;
      --math-text: #CECBF6;
      --math-sub: #AFA9EC;
      --chem-bg: #085041;
      --chem-text: #9FE1CB;
      --chem-sub: #5DCAA5;
    }
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    background: var(--bg3);
    color: var(--text);
    min-height: 100vh;
    padding: 1.5rem 1rem 3rem;
  }
  .app {
    max-width: 560px;
    margin: 0 auto;
  }
  .hdr { text-align: center; margin-bottom: 1.5rem; }
  .hdr-t { font-size: 20px; font-weight: 600; color: var(--text); letter-spacing: -0.4px; }
  .hdr-s { font-size: 12px; color: var(--text2); margin-top: 4px; }
  .stats {
    display: grid;
    grid-template-columns: repeat(4, minmax(0,1fr));
    gap: 8px;
    margin-bottom: 1.25rem;
  }
  .stat {
    background: var(--bg);
    border-radius: var(--radius-md);
    border: 0.5px solid var(--border);
    padding: 10px 6px;
    text-align: center;
  }
  .sn { font-size: 20px; font-weight: 600; color: var(--text); }
  .sl { font-size: 10px; color: var(--text2); margin-top: 2px; }
  .carousel-outer {
    overflow: hidden;
    border-radius: var(--radius-lg);
    touch-action: pan-y;
    cursor: grab;
    user-select: none;
    -webkit-user-select: none;
  }
  .carousel-outer:active { cursor: grabbing; }
  .carousel-track { display: flex; will-change: transform; }
  .ccard {
    min-width: 100%;
    flex-shrink: 0;
    padding: 1.25rem;
    background: var(--bg);
    border: 0.5px solid var(--border);
    border-radius: var(--radius-lg);
  }
  .ccard.today { border: 2px solid var(--phy); }
  .ctop {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 1rem;
  }
  .cday { font-size: 26px; font-weight: 600; color: var(--text); line-height: 1; }
  .cdate { font-size: 11px; color: var(--text2); margin-top: 4px; }
  .cbadge {
    font-size: 10px;
    padding: 3px 9px;
    border-radius: 20px;
    font-weight: 600;
  }
  .b-today { background: var(--phy-bg); color: var(--phy-text); }
  .b-sun { background: var(--bg2); color: var(--text2); border: 0.5px solid var(--border); }
  .b-sat { background: var(--math-bg); color: var(--math-text); }
  .b-norm { background: var(--chem-bg); color: var(--chem-text); }
  .subjects {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: 8px;
  }
  .subj { border-radius: var(--radius-md); padding: 10px 12px; }
  .sp { background: var(--phy-bg); }
  .sm { background: var(--math-bg); }
  .sc { background: var(--chem-bg); }
  .sr { background: var(--bg2); border: 0.5px solid var(--border); }
  .stag { font-size: 10px; font-weight: 600; margin-bottom: 3px; }
  .sp .stag { color: var(--phy-sub); }
  .sm .stag { color: var(--math-sub); }
  .sc .stag { color: var(--chem-sub); }
  .sr .stag { color: var(--text2); }
  .sch { font-size: 12px; font-weight: 600; line-height: 1.3; }
  .sp .sch { color: var(--phy-text); }
  .sm .sch { color: var(--math-text); }
  .sc .sch { color: var(--chem-text); }
  .sr .sch { color: var(--text2); }
  .slec { font-size: 10px; margin-top: 3px; }
  .sp .slec { color: var(--phy-sub); }
  .sm .slec { color: var(--math-sub); }
  .sc .slec { color: var(--chem-sub); }
  .sr .slec { color: var(--text3); }
  .dots {
    display: flex;
    justify-content: center;
    gap: 4px;
    margin-top: 10px;
    flex-wrap: wrap;
  }
  .dot {
    width: 5px; height: 5px;
    border-radius: 50%;
    background: var(--border2);
    transition: all 0.25s;
    cursor: pointer;
    flex-shrink: 0;
  }
  .dot.on { background: var(--phy); width: 16px; border-radius: 99px; }
  .xp-box {
    background: var(--bg);
    border: 0.5px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 1.25rem;
    margin-top: 1.25rem;
  }
  .xp-hdr {
    font-size: 10px;
    font-weight: 700;
    color: var(--text2);
    letter-spacing: 1px;
    text-transform: uppercase;
    margin-bottom: 14px;
  }
  .xr { margin-bottom: 14px; }
  .xr:last-child { margin-bottom: 0; }
  .xtop {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 6px;
  }
  .xname {
    font-size: 13px;
    font-weight: 600;
    color: var(--text);
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .xlv {
    font-size: 9px;
    padding: 2px 7px;
    border-radius: 20px;
    background: var(--bg2);
    color: var(--text2);
    font-weight: 700;
    letter-spacing: 0.3px;
  }
  .xval { font-size: 10px; color: var(--text2); }
  .xtrack {
    height: 10px;
    background: var(--bg2);
    border-radius: 99px;
    overflow: hidden;
  }
  .xfill {
    height: 100%;
    border-radius: 99px;
    transition: width 0.5s cubic-bezier(.4,0,.2,1);
    position: relative;
  }
  .xfill::after {
    content: '';
    position: absolute;
    top: 0; right: 0;
    width: 4px; height: 100%;
    background: rgba(255,255,255,0.3);
    border-radius: 99px;
  }
  .xfill.xp { background: var(--phy); }
  .xfill.xm { background: var(--math); }
  .xfill.xc { background: var(--chem); }
  .footer {
    text-align: center;
    font-size: 10px;
    color: var(--text3);
    margin-top: 2rem;
  }
</style>
</head>
<body>
<div class="app">
  <div class="hdr">
    <div class="hdr-t">Arjuna JEE 2027 — Study Planner</div>
    <div class="hdr-s">Day 58 (May 4) → Day 180 (Sep 3, 2026)</div>
  </div>

  <div class="stats">
    <div class="stat"><div class="sn" id="s-d">58</div><div class="sl">Day</div></div>
    <div class="stat"><div class="sn" id="s-dt">4 May</div><div class="sl">Date</div></div>
    <div class="stat"><div class="sn" id="s-r">122</div><div class="sl">Days left</div></div>
    <div class="stat"><div class="sn" id="s-p">0%</div><div class="sl">Done</div></div>
  </div>

  <div class="carousel-outer" id="outer">
    <div class="carousel-track" id="track"></div>
  </div>
  <div class="dots" id="dots"></div>

  <div class="xp-box">
    <div class="xp-hdr">XP Progress</div>
    <div class="xr">
      <div class="xtop">
        <span class="xname">Physics <span class="xlv" id="lp">LV 1</span></span>
        <span class="xval" id="vp">0 / 192 XP</span>
      </div>
      <div class="xtrack"><div class="xfill xp" id="bp" style="width:0%"></div></div>
    </div>
    <div class="xr">
      <div class="xtop">
        <span class="xname">Maths <span class="xlv" id="lm">LV 1</span></span>
        <span class="xval" id="vm">0 / 192 XP</span>
      </div>
      <div class="xtrack"><div class="xfill xm" id="bm" style="width:0%"></div></div>
    </div>
    <div class="xr">
      <div class="xtop">
        <span class="xname">Chemistry <span class="xlv" id="lc">LV 1</span></span>
        <span class="xval" id="vc">0 / 183 XP</span>
      </div>
      <div class="xtrack"><div class="xfill xc" id="bc" style="width:0%"></div></div>
    </div>
  </div>

  <div class="footer">Arjuna JEE 2027 · Astha Rai · PW</div>
</div>

<script>
const PHY=[
  {ch:"Ch-03: Motion in a Plane",lecs:7,s:18},
  {ch:"Ch-04: Laws of Motion",lecs:19,s:1},
  {ch:"Ch-05: Circular Motion",lecs:10,s:1},
  {ch:"Ch-06: Work, Energy & Power",lecs:13,s:1},
  {ch:"Ch-07: Units & Dimensions",lecs:2,s:1},
  {ch:"Ch-08: Centre of Mass",lecs:14,s:1},
  {ch:"Ch-09: Rotational Motion",lecs:16,s:1},
  {ch:"Ch-10: Gravitation",lecs:9,s:1},
  {ch:"Ch-11: Mech. Prop. of Solids",lecs:5,s:1},
  {ch:"Ch-12: Mech. Prop. of Fluids",lecs:13,s:1},
  {ch:"Ch-13: Thermal Properties",lecs:8,s:1},
  {ch:"Ch-14: Kinetic Theory of Gases",lecs:1,s:1},
  {ch:"Ch-15: Thermodynamics",lecs:6,s:1},
  {ch:"Ch-16: Oscillations",lecs:7,s:1},
  {ch:"Ch-17: Waves",lecs:8,s:1},
];
const MATH=[
  {ch:"Ch-05: Quadratic Equation",lecs:13,s:1},
  {ch:"Ch-06: Trig. Equation",lecs:5,s:1},
  {ch:"Ch-07: Sequence & Series",lecs:12,s:1},
  {ch:"Ch-08: Permutation & Comb.",lecs:15,s:1},
  {ch:"Ch-09: Binomial Theorem",lecs:8,s:1},
  {ch:"Ch-10: Solution of Triangle",lecs:11,s:1},
  {ch:"Ch-11: Straight Line",lecs:17,s:1},
  {ch:"Ch-12: Circle",lecs:15,s:1},
  {ch:"Ch-13: Parabola",lecs:10,s:1},
  {ch:"Ch-14: Ellipse",lecs:9,s:1},
  {ch:"Ch-15: Hyperbola",lecs:5,s:1},
  {ch:"Ch-16: Complex Number",lecs:17,s:1},
  {ch:"Ch-17: Statistics",lecs:4,s:1},
  {ch:"Ch-18: Probability",lecs:9,s:1},
];
const CHEM=[
  {ch:"Ph: States of Matter",lecs:9,s:1},
  {ch:"Ph: Thermodynamics",lecs:18,s:1},
  {ch:"Ph: Chemical Equilibrium",lecs:3,s:1},
  {ch:"Ph: Ionic Equilibrium",lecs:13,s:1},
  {ch:"Ph: Redox Reaction",lecs:9,s:1},
  {ch:"Or: IUPAC Nomenclature",lecs:5,s:1},
  {ch:"Or: Isomerism",lecs:12,s:1},
  {ch:"Or: G.O.C",lecs:16,s:1},
  {ch:"Or: Hydrocarbons",lecs:23,s:1},
  {ch:"In: Classification & Periodicity",lecs:7,s:1},
  {ch:"In: Chemical Bonding",lecs:15,s:1},
  {ch:"In: Hydrogen & Compounds",lecs:3,s:1},
  {ch:"In: S-block Elements",lecs:5,s:1},
  {ch:"In: P-block Elements",lecs:5,s:1},
];

const PT=192,MT=192,CT=183;
const S=58,E=180,TOTAL=E-S+1;
const BASE=new Date(2025,11,1);
const MO=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const WF=["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];

function gd(d){let x=new Date(BASE);x.setDate(x.getDate()+d-1);return x;}

function countTo(d){
  let p=0,m=0,c=0;
  for(let i=1;i<=d;i++){
    let w=gd(i).getDay(),wd=w>=1&&w<=5,sa=w===6;
    if(wd){p++;m++;c++;}
    if(sa){m++;c++;}
  }
  return{p:Math.min(p,PT),m:Math.min(m,MT),c:Math.min(c,CT)};
}

const BASE58=countTo(57);

function getLec(arr,rawDone){
  if(rawDone<=0)return{ch:arr[0].ch,lec:arr[0].s};
  let r=rawDone;
  for(let ch of arr){
    if(r<=ch.lecs)return{ch:ch.ch,lec:(ch.s||1)+r-1};
    r-=ch.lecs;
  }
  return{ch:"All complete!",lec:0};
}

function lv(pct){
  if(pct<15)return"LV 1";if(pct<30)return"LV 2";if(pct<45)return"LV 3";
  if(pct<60)return"LV 4";if(pct<75)return"LV 5";if(pct<90)return"LV 6";return"LV 7 MAX";
}

function buildCard(d){
  let dt=gd(d);
  let dow=dt.getDay(),sun=dow===0,sat=dow===6,isT=d===58;
  let prev=countTo(d-1),curr=countTo(d);
  let pp=curr.p-prev.p,pm=curr.m-prev.m,pc=curr.c-prev.c;
  let rp=curr.p-BASE58.p,rm=curr.m-BASE58.m,rc=curr.c-BASE58.c;
  let pi=getLec(PHY,rp),mi=getLec(MATH,rm),ci=getLec(CHEM,rc);
  let badge=isT?'<span class="cbadge b-today">Today</span>':sun?'<span class="cbadge b-sun">Rest</span>':sat?'<span class="cbadge b-sat">Sat</span>':'<span class="cbadge b-norm">Study</span>';
  let subs='';
  if(sun){
    subs=`<div class="subj sr" style="grid-column:1/-1"><div class="stag">Sunday</div><div class="sch">Rest, revise or catch up</div><div class="slec">No new lectures</div></div>`;
  } else {
    if(pp)subs+=`<div class="subj sp"><div class="stag">Physics — Nitin Sir</div><div class="sch">${pi.ch}</div><div class="slec">Lecture ${pi.lec}</div></div>`;
    if(pm)subs+=`<div class="subj sm"><div class="stag">Maths — Sudarshan Sir</div><div class="sch">${mi.ch}</div><div class="slec">Lecture ${mi.lec}</div></div>`;
    if(pc)subs+=`<div class="subj sc"><div class="stag">Chemistry — Arpit Sir</div><div class="sch">${ci.ch}</div><div class="slec">Lecture ${ci.lec}</div></div>`;
  }
  return`<div class="ccard${isT?' today':''}"><div class="ctop"><div><div class="cday">Day ${d}</div><div class="cdate">${WF[dow]}, ${dt.getDate()} ${MO[dt.getMonth()]} 2026</div></div>${badge}</div><div class="subjects">${subs}</div></div>`;
}

const track=document.getElementById('track');
const outer=document.getElementById('outer');
const dotsEl=document.getElementById('dots');

for(let d=S;d<=E;d++) track.insertAdjacentHTML('beforeend',buildCard(d));

let cur=0;
function getW(){return outer.offsetWidth;}

function scrollTo(idx,anim){
  idx=Math.max(0,Math.min(TOTAL-1,idx));
  cur=idx;
  let w=getW();
  track.style.transition=anim?'transform 0.35s cubic-bezier(.4,0,.2,1)':'none';
  track.style.transform=`translateX(${-idx*w}px)`;
  updateUI(S+idx);
  updateDots(idx);
}

function updateUI(d){
  let dt=gd(d);
  document.getElementById('s-d').textContent=d;
  document.getElementById('s-dt').textContent=`${dt.getDate()} ${MO[dt.getMonth()]}`;
  document.getElementById('s-r').textContent=180-d;
  document.getElementById('s-p').textContent=Math.round(((d-S)/(E-S))*100)+'%';
  let c=countTo(d);
  let rp=c.p-BASE58.p,rm=c.m-BASE58.m,rc=c.c-BASE58.c;
  let pp=Math.min(100,Math.round((rp/PT)*100));
  let pm=Math.min(100,Math.round((rm/MT)*100));
  let pc=Math.min(100,Math.round((rc/CT)*100));
  document.getElementById('bp').style.width=pp+'%';
  document.getElementById('bm').style.width=pm+'%';
  document.getElementById('bc').style.width=pc+'%';
  document.getElementById('vp').textContent=`${rp} / ${PT} XP`;
  document.getElementById('vm').textContent=`${rm} / ${MT} XP`;
  document.getElementById('vc').textContent=`${rc} / ${CT} XP`;
  document.getElementById('lp').textContent=lv(pp);
  document.getElementById('lm').textContent=lv(pm);
  document.getElementById('lc').textContent=lv(pc);
}

const DOT_SHOW=15;
function updateDots(idx){
  dotsEl.innerHTML='';
  let half=Math.floor(DOT_SHOW/2);
  let start=Math.max(0,idx-half);
  let end=Math.min(TOTAL-1,start+DOT_SHOW-1);
  if(end-start<DOT_SHOW-1)start=Math.max(0,end-DOT_SHOW+1);
  for(let i=start;i<=end;i++){
    let dot=document.createElement('div');
    dot.className='dot'+(i===idx?' on':'');
    dot.onclick=(function(ii){return()=>scrollTo(ii,true);})(i);
    dotsEl.appendChild(dot);
  }
}

let startX=0,startY=0,isDragging=false,lastX=0,velX=0,lastT=0;

outer.addEventListener('mousedown',e=>{
  isDragging=true;startX=e.clientX;lastX=e.clientX;velX=0;lastT=Date.now();
  track.style.transition='none';
});
window.addEventListener('mousemove',e=>{
  if(!isDragging)return;
  let now=Date.now(),dx=e.clientX-lastX;
  velX=dx/(now-lastT+1)*16;lastX=e.clientX;lastT=now;
  track.style.transform=`translateX(${-cur*getW()+(e.clientX-startX)}px)`;
});
window.addEventListener('mouseup',e=>{
  if(!isDragging)return;
  isDragging=false;
  let moved=Math.round((-(e.clientX-startX)+velX*8)/getW());
  scrollTo(cur+moved,true);
});

outer.addEventListener('touchstart',e=>{
  startX=e.touches[0].clientX;startY=e.touches[0].clientY;
  lastX=startX;velX=0;lastT=Date.now();
  track.style.transition='none';
},{passive:true});
outer.addEventListener('touchmove',e=>{
  let dx=e.touches[0].clientX-startX;
  let dy=e.touches[0].clientY-startY;
  if(Math.abs(dy)>Math.abs(dx))return;
  e.preventDefault();
  let now=Date.now(),ddx=e.touches[0].clientX-lastX;
  velX=ddx/(now-lastT+1)*16;lastX=e.touches[0].clientX;lastT=now;
  track.style.transform=`translateX(${-cur*getW()+dx}px)`;
},{passive:false});
outer.addEventListener('touchend',e=>{
  let diff=e.changedTouches[0].clientX-startX;
  let moved=Math.round((-diff+velX*8)/getW());
  scrollTo(cur+moved,true);
});

window.addEventListener('resize',()=>{
  track.style.transition='none';
  track.style.transform=`translateX(${-cur*getW()}px)`;
});

scrollTo(0,false);
</script>
</body>
</html>
