<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>10th 2026 Result - Saint Joseph Sr Sec School</title>
    <style>
        :root {
            --bg-color: #f4f4f9;
            --text-main: #2c3e50;
            --accent-gold: #d4af37;
            --accent-blue: #3498db;
            --card-bg: rgba(255, 255, 255, 0.9);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #e0eafc, #cfdef3);
            color: var(--text-main);
            overflow-x: hidden;
            min-height: 100vh;
        }

        /* --- Landing Page --- */
        #landing-page {
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
            transition: opacity 0.8s ease-out, transform 0.8s ease-out;
        }

        .school-name {
            font-size: 2rem;
            letter-spacing: 2px;
            margin-bottom: 10px;
            animation: slideDown 1s ease-out;
        }

        .main-title {
            font-size: 4rem;
            font-weight: 800;
            margin-bottom: 30px;
            color: #1a252f;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
            animation: fadeIn 1.5s ease-out;
        }

        .enter-btn {
            padding: 15px 40px;
            font-size: 1.2rem;
            border: none;
            border-radius: 30px;
            background: var(--text-main);
            color: white;
            cursor: pointer;
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
            transition: all 0.3s ease;
            position: relative;
            z-index: 10;
        }

        .enter-btn:hover {
            transform: translateY(-3px) scale(1.05);
            background: var(--accent-gold);
            color: #000;
        }

        .features-block {
            margin-top: 40px;
            max-width: 600px;
            font-size: 0.9rem;
            opacity: 0.7;
            animation: slideUp 1.2s ease-out;
        }

        /* --- Main App Container --- */
        #app-container {
            display: none;
            padding: 20px;
            max-width: 1200px;
            margin: 0 auto;
            animation: fadeIn 0.8s ease-out;
        }

        /* Controls Area */
        .controls {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            background: var(--card-bg);
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            margin-bottom: 30px;
            gap: 15px;
        }

        .search-bar {
            flex: 1;
            min-width: 250px;
            padding: 12px 20px;
            border: 2px solid #ddd;
            border-radius: 25px;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.3s;
        }

        .search-bar:focus {
            border-color: var(--accent-blue);
        }

        .tabs {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding-bottom: 5px;
        }

        .tab-btn {
            padding: 10px 20px;
            border: none;
            border-radius: 20px;
            background: #eee;
            cursor: pointer;
            white-space: nowrap;
            transition: background 0.3s;
        }

        .tab-btn.active {
            background: var(--text-main);
            color: white;
        }

        .toggle-container {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.9rem;
            font-weight: bold;
        }

        /* Switch */
        .switch {
            position: relative;
            display: inline-block;
            width: 50px;
            height: 24px;
        }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider {
            position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0;
            background-color: #ccc; transition: .4s; border-radius: 34px;
        }
        .slider:before {
            position: absolute; content: ""; height: 16px; width: 16px; left: 4px; bottom: 4px;
            background-color: white; transition: .4s; border-radius: 50%;
        }
        input:checked + .slider { background-color: var(--accent-gold); }
        input:checked + .slider:before { transform: translateX(26px); }

        /* --- Rankings Display --- */
        .top-rankers {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 20px;
            margin-bottom: 40px;
        }

        .silhouette-card {
            background: linear-gradient(to bottom, #ffffff, #f0f0f0);
            border-radius: 20px;
            padding: 20px;
            text-align: center;
            width: 200px;
            box-shadow: 0 15px 30px rgba(0,0,0,0.1);
            cursor: pointer;
            transition: transform 0.3s, box-shadow 0.3s;
            position: relative;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.5);
        }

        .silhouette-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 20px 40px rgba(0,0,0,0.15);
        }

        .rank-badge {
            font-size: 2rem;
            font-style: italic;
            font-weight: 900;
            color: var(--accent-gold);
            margin-bottom: 10px;
            font-family: 'Times New Roman', Times, serif;
        }

        .student-name { font-weight: bold; font-size: 1.1rem; margin-bottom: 5px; }
        .student-score { color: #555; font-size: 0.9rem; }

        .list-rankers {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .list-item {
            background: var(--card-bg);
            padding: 15px 20px;
            border-radius: 10px;
            display: flex;
            justify-content: space-between;
            cursor: pointer;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            transition: background 0.2s;
        }

        .list-item:hover { background: #fff; }

        /* --- MacOS Style Popup --- */
        #popup-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.4);
            backdrop-filter: blur(5px);
            z-index: 100;
            justify-content: center;
            align-items: center;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .mac-window {
            background: #fff;
            width: 90%;
            max-width: 600px;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 25px 50px rgba(0,0,0,0.3);
            transform: scale(0.9) translateY(20px);
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .mac-header {
            background: #e2e2e2;
            padding: 10px 15px;
            display: flex;
            align-items: center;
            border-bottom: 1px solid #ccc;
        }

        .mac-btns {
            display: flex;
            gap: 8px;
        }

        .mac-btn {
            width: 12px; height: 12px; border-radius: 50%; cursor: pointer;
        }
        .close-btn { background: #ff5f56; }
        .min-btn { background: #ffbd2e; }
        .max-btn { background: #27c93f; }

        .popup-content { padding: 30px; max-height: 80vh; overflow-y: auto; }
        .popup-header h2 { margin-bottom: 5px; }
        .popup-header p { color: #666; font-size: 0.9rem; margin-bottom: 20px; }

        .subject-table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        .subject-table th, .subject-table td {
            text-align: left; padding: 10px; border-bottom: 1px solid #eee;
        }
        .subject-table th { background: #f9f9f9; }

        /* Animations */
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideDown { from { transform: translateY(-30px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        @keyframes slideUp { from { transform: translateY(30px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

        @media (max-width: 600px) {
            .main-title { font-size: 2.5rem; }
            .controls { flex-direction: column; align-items: stretch; }
            .search-bar { width: 100%; }
        }
    </style>
</head>
<body>

    <div id="landing-page">
        <div class="school-name">Saint Joseph Sr Sec School</div>
        <h1 class="main-title">10th 2026 Result</h1>
        <button class="enter-btn" onclick="enterApp()">View Rankings</button>
        <div class="features-block">
            Explore comprehensive academic performance, dynamic Top 5 & Main 5 ranking systems, subject-wise analytics, and an interactive grading toggle for seamless evaluation.
        </div>
    </div>

    <div id="app-container">
        <div class="controls">
            <input type="text" id="search-input" class="search-bar" placeholder="Search by student name..." oninput="renderData()">
            
            <div class="tabs" id="category-tabs">
                <button class="tab-btn active" onclick="setCategory('top5')">Top 5</button>
                <button class="tab-btn" onclick="setCategory('main5')">Main 5</button>
                <button class="tab-btn" onclick="setCategory('english')">English</button>
                <button class="tab-btn" onclick="setCategory('maths')">Mathematics</button>
                <button class="tab-btn" onclick="setCategory('science')">Science</button>
                <button class="tab-btn" onclick="setCategory('sst')">Social Science</button>
            </div>

            <div class="toggle-container">
                <span>Assume 20 Internal</span>
                <label class="switch">
                    <input type="checkbox" id="internal-toggle" onchange="renderData()">
                    <span class="slider"></span>
                </label>
            </div>
        </div>

        <div id="results-display">
            <div class="top-rankers" id="top-rankers-container"></div>
            <div class="list-rankers" id="list-rankers-container"></div>
        </div>
    </div>

    <div id="popup-overlay" onclick="closePopup(event)">
        <div class="mac-window" id="mac-window" onclick="event.stopPropagation()">
            <div class="mac-header">
                <div class="mac-btns">
                    <div class="mac-btn close-btn" onclick="closePopup(null, true)"></div>
                    <div class="mac-btn min-btn"></div>
                    <div class="mac-btn max-btn"></div>
                </div>
            </div>
            <div class="popup-content" id="popup-content">
                </div>
        </div>
    </div>

    <script>
        // ==========================================
        // DATA INJECTION
        // Paste the exact contents of your cbse_all_results.json 
        // into the array below. Here is a small sample matching your schema.
        // ==========================================
        const rawData = {
            "results": [
                {
                    "roll": "19196301",
                    "name": "SOUMYA JAIN",
                    "school": "HOLY FAMILY CONVENT HR SEC SCH",
                    "subjects": [
                        {"code": "184", "subject": "ENGLISH LNG & LIT.", "theory": "066", "ia_prac": "020"},
                        {"code": "002", "subject": "HINDI COURSE-A", "theory": "066", "ia_prac": "020"},
                        {"code": "241", "subject": "MATHEMATICS BASIC", "theory": "049", "ia_prac": "018"},
                        {"code": "086", "subject": "SCIENCE", "theory": "053", "ia_prac": "019"},
                        {"code": "087", "subject": "SOCIAL SCIENCE", "theory": "064", "ia_prac": "019"},
                        {"code": "417", "subject": "ARTIFICIAL INTELLIGENCE", "theory": "032", "ia_prac": "050"}
                    ]
                },
                {
                    "roll": "19196631",
                    "name": "MANYA JAIN",
                    "school": "DELHI PUBLIC SCHOOL",
                    "subjects": [
                        {"code": "184", "subject": "ENGLISH LNG & LIT.", "theory": "052", "ia_prac": "020"},
                        {"code": "085", "subject": "HINDI COURSE-B", "theory": "054", "ia_prac": "020"},
                        {"code": "241", "subject": "MATHEMATICS BASIC", "theory": "031", "ia_prac": "019"},
                        {"code": "086", "subject": "SCIENCE", "theory": "040", "ia_prac": "020"},
                        {"code": "087", "subject": "SOCIAL SCIENCE", "theory": "055", "ia_prac": "019"}
                    ]
                },
                 {
                    "roll": "19196632",
                    "name": "ARUN KUMAR",
                    "school": "SAINT JOSEPH SR SEC",
                    "subjects": [
                        {"code": "184", "subject": "ENGLISH LNG & LIT.", "theory": "080", "ia_prac": "020"},
                        {"code": "002", "subject": "HINDI COURSE-A", "theory": "075", "ia_prac": "015"},
                        {"code": "041", "subject": "MATHEMATICS STANDARD", "theory": "080", "ia_prac": "020"},
                        {"code": "086", "subject": "SCIENCE", "theory": "080", "ia_prac": "020"},
                        {"code": "087", "subject": "SOCIAL SCIENCE", "theory": "079", "ia_prac": "020"}
                    ]
                }
            ]
        };

        let currentCategory = 'top5';
        const students = rawData.results;

        // UI Transitions
        function enterApp() {
            const landing = document.getElementById('landing-page');
            const app = document.getElementById('app-container');
            landing.style.opacity = '0';
            landing.style.transform = 'scale(0.95)';
            setTimeout(() => {
                landing.style.display = 'none';
                app.style.display = 'block';
                renderData();
            }, 800);
        }

        function setCategory(cat) {
            currentCategory = cat;
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            renderData();
        }

        // Calculation Helpers
        function getSubjectScore(sub, assume20) {
            let theory = parseInt(sub.theory, 10) || 0;
            let prac = assume20 ? 20 : (parseInt(sub.ia_prac, 10) || 0);
            let total = theory + prac;
            return total > 100 ? 100 : total; // Cap at 100
        }

        function calculateStudentScore(student, assume20, category) {
            let scores = student.subjects.map(s => ({
                name: s.subject,
                code: s.code,
                total: getSubjectScore(s, assume20)
            }));

            if (category === 'top5') {
                // Rule: English mandatory + top 4 others
                let eng = scores.find(s => s.code === '184' || s.name.includes("ENGLISH"));
                let others = scores.filter(s => s.code !== '184' && !s.name.includes("ENGLISH"))
                                   .sort((a,b) => b.total - a.total)
                                   .slice(0, 4);
                let selected = eng ? [eng, ...others] : others.slice(0,5);
                let total = selected.reduce((sum, s) => sum + s.total, 0);
                return total;
            } 
            else if (category === 'main5') {
                // Rule: English, Hindi, Maths, Sci, SSt
                const mainCodes = ['184', '002', '085', '241', '041', '086', '087'];
                let mainSubs = scores.filter(s => mainCodes.includes(s.code));
                return mainSubs.reduce((sum, s) => sum + s.total, 0);
            }
            else {
                // Single Subject logic
                let match = scores.find(s => s.name.toLowerCase().includes(category.toLowerCase()));
                return match ? match.total : -1;
            }
        }

        // Main Render Function
        function renderData() {
            const searchQuery = document.getElementById('search-input').value.toLowerCase();
            const assume20 = document.getElementById('internal-toggle').checked;
            
            let processedList = students.map(student => {
                return {
                    ...student,
                    calculatedScore: calculateStudentScore(student, assume20, currentCategory)
                }
            }).filter(student => student.calculatedScore > -1);

            // Filter by search
            if (searchQuery) {
                processedList = processedList.filter(s => s.name.toLowerCase().includes(searchQuery));
            }

            // Sort Descending
            processedList.sort((a, b) => b.calculatedScore - a.calculatedScore);

            const topContainer = document.getElementById('top-rankers-container');
            const listContainer = document.getElementById('list-rankers-container');
            topContainer.innerHTML = '';
            listContainer.innerHTML = '';

            // Grouping logic for ranks
            let currentRank = 1;
            let currentDisplayRank = 1;
            let previousScore = null;

            processedList.forEach((student, index) => {
                if (previousScore !== null && student.calculatedScore < previousScore) {
                    currentDisplayRank = currentRank;
                }
                
                const isTopRank = currentDisplayRank <= 5; // Show Top 5 as Silhouettes

                const elementHTML = isTopRank ? 
                    `<div class="silhouette-card" onclick='openPopup(${JSON.stringify(student).replace(/'/g, "&#39;")}, ${assume20})'>
                        <div class="rank-badge">#${currentDisplayRank}</div>
                        <div class="student-name">${student.name}</div>
                        <div class="student-score">Score: ${student.calculatedScore}</div>
                    </div>` :
                    `<div class="list-item" onclick='openPopup(${JSON.stringify(student).replace(/'/g, "&#39;")}, ${assume20})'>
                        <div><strong>#${currentDisplayRank}</strong> &nbsp; ${student.name}</div>
                        <div>${student.calculatedScore}</div>
                    </div>`;

                if (isTopRank) {
                    topContainer.innerHTML += elementHTML;
                } else {
                    listContainer.innerHTML += elementHTML;
                }

                currentRank++;
                previousScore = student.calculatedScore;
            });

            if (processedList.length === 0) {
                listContainer.innerHTML = "<p style='text-align:center;'>No students found.</p>";
            }
        }

        // Popup Logic
        function openPopup(student, assume20) {
            const overlay = document.getElementById('popup-overlay');
            const win = document.getElementById('mac-window');
            const content = document.getElementById('popup-content');

            let tableHTML = `
                <div class="popup-header">
                    <h2>${student.name}</h2>
                    <p>Roll No: ${student.roll} | ${student.school}</p>
                </div>
                <table class="subject-table">
                    <tr>
                        <th>Subject</th>
                        <th>Theory</th>
                        <th>Internal/Prac</th>
                        <th>Total</th>
                    </tr>
            `;

            let grandTotal = 0;
            student.subjects.forEach(sub => {
                let th = parseInt(sub.theory, 10) || 0;
                let pr = assume20 ? 20 : (parseInt(sub.ia_prac, 10) || 0);
                let tot = (th + pr) > 100 ? 100 : (th + pr);
                grandTotal += tot;
                
                tableHTML += `
                    <tr>
                        <td>${sub.subject}</td>
                        <td>${th}</td>
                        <td><span style="${assume20 ? 'color: var(--accent-gold); font-weight:bold;' : ''}">${pr}</span></td>
                        <td><strong>${tot}</strong></td>
                    </tr>
                `;
            });

            tableHTML += `</table>
                <h3 style="margin-top:20px; text-align:right;">Grand Total: ${grandTotal}</h3>
            `;

            content.innerHTML = tableHTML;
            overlay.style.display = 'flex';
            setTimeout(() => {
                overlay.style.opacity = '1';
                win.style.transform = 'scale(1) translateY(0)';
            }, 10);
        }

        function closePopup(e, force = false) {
            if (force || e.target === document.getElementById('popup-overlay')) {
                const overlay = document.getElementById('popup-overlay');
                const win = document.getElementById('mac-window');
                
                overlay.style.opacity = '0';
                win.style.transform = 'scale(0.9) translateY(20px)';
                
                setTimeout(() => {
                    overlay.style.display = 'none';
                }, 300);
            }
        }
    </script>
</body>
</html>
