<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>10th 2026 Result - Saint Joseph Sr Sec School</title>
    <style>
        :root {
            --bg-color: #f4f4f9;
            --text-main: #2c3e50;
            --accent-gold: #d4af37;
            --accent-blue: #3498db;
            --card-bg: rgba(255, 255, 255, 0.9);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }

        body {
            background: linear-gradient(135deg, #e0eafc, #cfdef3);
            color: var(--text-main);
            min-height: 100vh;
        }

        /* --- Landing Page --- */
        #landing-page {
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
            transition: all 0.8s ease;
        }

        .main-title { font-size: 3.5rem; font-weight: 800; margin-bottom: 20px; color: #1a252f; }
        
        .upload-area {
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            margin-bottom: 30px;
        }

        .enter-btn {
            padding: 15px 40px;
            font-size: 1.2rem;
            border: none;
            border-radius: 30px;
            background: var(--text-main);
            color: white;
            cursor: pointer;
            transition: 0.3s;
        }

        .enter-btn:hover { background: var(--accent-gold); color: black; transform: scale(1.05); }

        /* --- Main App Container --- */
        #app-container { display: none; padding: 20px; max-width: 1200px; margin: 0 auto; }

        .controls {
            display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center;
            background: var(--card-bg); padding: 20px; border-radius: 15px; margin-bottom: 30px; gap: 15px;
        }

        .search-bar { flex: 1; min-width: 250px; padding: 12px 20px; border: 2px solid #ddd; border-radius: 25px; outline: none; }

        .tab-btn { padding: 10px 20px; border: none; border-radius: 20px; background: #eee; cursor: pointer; }
        .tab-btn.active { background: var(--text-main); color: white; }

        /* --- Rankings --- */
        .top-rankers { display: flex; justify-content: center; flex-wrap: wrap; gap: 20px; margin-bottom: 40px; }
        .silhouette-card {
            background: white; border-radius: 20px; padding: 20px; text-align: center; width: 180px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1); cursor: pointer; transition: 0.3s;
        }
        .silhouette-card:hover { transform: translateY(-10px); }
        .rank-badge { font-size: 2rem; color: var(--accent-gold); font-weight: 900; }

        .list-item {
            background: white; padding: 15px 20px; border-radius: 10px; display: flex; 
            justify-content: space-between; cursor: pointer; margin-bottom: 8px;
        }

        /* --- Popup --- */
        #popup-overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5); backdrop-filter: blur(5px); z-index: 100;
            justify-content: center; align-items: center;
        }
        .mac-window { background: white; width: 90%; max-width: 600px; border-radius: 12px; overflow: hidden; }
        .mac-header { background: #e2e2e2; padding: 10px; display: flex; gap: 8px; }
        .mac-btn { width: 12px; height: 12px; border-radius: 50%; }
        .popup-content { padding: 30px; max-height: 80vh; overflow-y: auto; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { text-align: left; padding: 10px; border-bottom: 1px solid #eee; }
    </style>
</head>
<body>

    <div id="landing-page">
        <h1 class="main-title">Saint Joseph Sr Sec School</h1>
        <p style="margin-bottom: 20px;">10th Class - 2026 Results Analytics</p>
        
        <div class="upload-area">
            <p style="margin-bottom: 10px; font-weight: bold;">Step 1: Upload your cbse_all_results.json</p>
            <input type="file" id="json-upload" accept=".json" style="margin-bottom: 20px;">
            <br>
            <button class="enter-btn" id="start-btn" onclick="processAndEnter()" disabled>Enter Portal</button>
        </div>
    </div>

    <div id="app-container">
        <div class="controls">
            <input type="text" id="search-input" class="search-bar" placeholder="Search student name..." oninput="renderData()">
            <div id="tabs">
                <button class="tab-btn active" onclick="setCategory('top5')">Top 5</button>
                <button class="tab-btn" onclick="setCategory('science')">Science</button>
                <button class="tab-btn" onclick="setCategory('maths')">Maths</button>
            </div>
            <label>
                <input type="checkbox" id="internal-toggle" onchange="renderData()"> Assume 20 Internal
            </label>
        </div>

        <div id="top-rankers-container" class="top-rankers"></div>
        <div id="list-rankers-container"></div>
    </div>

    <div id="popup-overlay" onclick="this.style.display='none'">
        <div class="mac-window" onclick="event.stopPropagation()">
            <div class="mac-header">
                <div class="mac-btn" style="background:#ff5f56" onclick="document.getElementById('popup-overlay').style.display='none'"></div>
                <div class="mac-btn" style="background:#ffbd2e"></div>
                <div class="mac-btn" style="background:#27c93f"></div>
            </div>
            <div class="popup-content" id="popup-content"></div>
        </div>
    </div>

    <script>
        let studentsData = [];
        let currentCategory = 'top5';

        // File Handling
        document.getElementById('json-upload').addEventListener('change', function(e) {
            const file = e.target.files[0];
            const reader = new FileReader();
            reader.onload = function(event) {
                const json = JSON.parse(event.target.result);
                studentsData = json.results;
                document.getElementById('start-btn').disabled = false;
                document.getElementById('start-btn').innerText = "Data Loaded - Enter Portal";
            };
            reader.readAsText(file);
        });

        function processAndEnter() {
            document.getElementById('landing-page').style.display = 'none';
            document.getElementById('app-container').style.display = 'block';
            renderData();
        }

        function setCategory(cat) {
            currentCategory = cat;
            renderData();
        }

        function calculateScore(student, assume20) {
            let scores = student.subjects.map(s => {
                let th = parseInt(s.theory) || 0;
                let pr = assume20 ? 20 : (parseInt(s.ia_prac) || 0);
                return { code: s.code, name: s.subject, total: Math.min(100, th + pr) };
            });

            if (currentCategory === 'top5') {
                let eng = scores.find(s => s.code === '184');
                let others = scores.filter(s => s.code !== '184').sort((a,b) => b.total - a.total);
                return (eng ? eng.total : 0) + others.slice(0, 4).reduce((sum, s) => sum + s.total, 0);
            } else {
                let match = scores.find(s => s.name.toLowerCase().includes(currentCategory));
                return match ? match.total : 0;
            }
        }

        function renderData() {
            const query = document.getElementById('search-input').value.toLowerCase();
            const assume20 = document.getElementById('internal-toggle').checked;
            
            let list = studentsData.map(s => ({ ...s, score: calculateScore(s, assume20) }))
                                   .filter(s => s.name.toLowerCase().includes(query))
                                   .sort((a, b) => b.score - a.score);

            const topDiv = document.getElementById('top-rankers-container');
            const listDiv = document.getElementById('list-rankers-container');
            topDiv.innerHTML = ''; listDiv.innerHTML = '';

            list.forEach((s, i) => {
                const html = `<div class="${i < 5 ? 'silhouette-card' : 'list-item'}" onclick='showDetails(${JSON.stringify(s)})'>
                    ${i < 5 ? `<div class="rank-badge">#${i+1}</div>` : `<strong>#${i+1}</strong>`}
                    <div>${s.name}</div>
                    <div style="font-weight:bold">${s.score}</div>
                </div>`;
                if (i < 5) topDiv.innerHTML += html;
                else listDiv.innerHTML += html;
            });
        }

        function showDetails(s) {
            let table = `<h3>${s.name}</h3><p>${s.school}</p><table><tr><th>Subject</th><th>Total</th></tr>`;
            s.subjects.forEach(sub => {
                table += `<tr><td>${sub.subject}</td><td>${parseInt(sub.theory) + parseInt(sub.ia_prac)}</td></tr>`;
            });
            document.getElementById('popup-content').innerHTML = table + `</table>`;
            document.getElementById('popup-overlay').style.display = 'flex';
        }
    </script>
</body>
</html>
